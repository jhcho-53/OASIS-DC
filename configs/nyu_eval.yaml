# NYU Depth V2 evaluation configuration
dataset: nyu

# Data configuration
data:
  data_root: "/path/to/NYUv2"
  test_list: "lists/nyu_test_full.txt"
  n_sparse: 500
  target_size: [240, 320]       # [H, W]
  est_mode: "precomputed"       # "precomputed", "foundation", "zeros"
  pre_mono_dir: "mono_rel"
  normalize_on_valid_gt: true

# Model configuration
model:
  dmax: 10.0
  steps: 8
  geometry: "hyper"
  use_sparse: true
  use_residual: true
  
  # Poisson solver
  poisson_tol: 1e-5
  poisson_maxiter: 1000
  poisson_init: "est"
  poisson_auto_flip: true
  poisson_est_affine: true
  poisson_smooth_est: true
  
  # Affinity propagation
  use_p_affinity: true
  p_only_gate: false
  kernels: [3, 5]
  kappa_min: 0.03
  kappa_max: 0.5
  
  # Anchor system
  anchor_learnable: true        # Can handle both learnable and non-learnable
  anchor_mode: "map"
  anchor_alpha: 0.3
  
  min_gate: 0.0
  min_alpha: 0.0

# Evaluation configuration
eval:
  batch_size: 1
  num_workers: 4
  mode: "all"                   # "all", "full", "residual_off", "poisson_only"
  save_predictions: false
  pred_dir: "predictions"

# Reproducibility
seed: 0